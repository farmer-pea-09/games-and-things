<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Care of a Pet</title>
  <link rel="stylesheet" href="css/pet.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <a href="index.html" id="home-link">← Games</a>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="picker">
      <div class="picker-header">
        <h2>Choose a pet</h2>
        <p>Search or pick an animal</p>
        <input id="pet-search" type="search" placeholder="Search for a pet..." autocomplete="off" spellcheck="false">
      </div>
      <div id="pet-grid"></div>
      <p id="pet-empty" class="hidden">No pet matches that search.</p>
    </div>
    <div id="care-buttons" class="hidden">
      <button type="button" data-care="food"><kbd>Z</kbd> Food</button>
      <button type="button" data-care="love"><kbd>A</kbd> Love</button>
      <button type="button" data-care="water"><kbd>S</kbd> Water</button>
      <button type="button" data-care="sleep"><kbd>X</kbd> Sleep</button>
      <button type="button" data-care="play"><kbd>P</kbd> Play</button>
      <button type="button" id="walk-btn"><kbd>W</kbd> <span class="btn-label">Walk</span></button>
    </div>
    <div id="overlay" class="hidden">
      <div id="overlay-content"></div>
    </div>
  </div>
  <script type="module">
    import { gateGame } from './js/room-code.js';
    if (gateGame('pet')) {
      await import('./js/pet.js');
    }
  </script>
</body>
</html>
