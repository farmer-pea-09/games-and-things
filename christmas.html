<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Pole Night</title>
  <link rel="stylesheet" href="css/christmas.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <a href="index.html" id="home-link">← Games</a>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span id="night-label">Night 1</span>
        <span id="score-label">★ 0</span>
        <span id="phase-label">Workshop</span>
      </div>
      <div id="quest-label">Make toys for the list</div>
      <div id="message-box"></div>
    </div>
    <div id="overlay">
      <div id="overlay-content"></div>
    </div>
    <div id="controls-help">
      <kbd>Click</kbd> make & wrap · <kbd>WASD</kbd> fly · <kbd>Shift</kbd> brake · <kbd>Space</kbd> drop · <kbd>1-5</kbd> pick present · <kbd>Esc</kbd> pause
    </div>
  </div>
  <script type="module">
    import { gateGame } from './js/room-code.js';
    if (gateGame('christmas')) {
      await import('./js/christmas.js');
    }
  </script>
</body>
</html>
